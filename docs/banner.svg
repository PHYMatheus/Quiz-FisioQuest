<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="titulo-svg desc-svg">
  <title id="titulo-svg">FisioQuest</title>
  <desc id="desc-svg">Quiz interativo de Fisioterapia</desc>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F14" />
      <stop offset="0.55" stop-color="#123321" />
      <stop offset="1" stop-color="#1F6B44" />
    </linearGradient>
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43B77A" />
      <stop offset="1" stop-color="#8FDBAF" />
    </linearGradient>
    <filter id="brilho" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="4" result="desfoque" />
      <feMerge>
        <feMergeNode in="desfoque" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="recorte">
      <rect width="1200" height="320" rx="24" />
    </clipPath>
  </defs>

  <style>
    .titulo {
      font: 800 74px "Space Grotesk", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -1px;
    }
    .subtitulo {
      font: 600 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .entrada {
      animation: subir 0.9s ease-out both;
    }
    .atraso-1 { animation-delay: 0.2s; }

    .bolha {
      fill: #43B77A;
      animation: flutuar 7s ease-in-out infinite alternate;
    }
    .bolha-2 { animation-duration: 9s; animation-delay: -3s; }
    .bolha-3 { animation-duration: 6s; animation-delay: -1.5s; }
    .bolha-4 { animation-duration: 11s; animation-delay: -5s; }

    .base-ecg {
      fill: none;
      stroke: #43B77A;
      stroke-opacity: 0.18;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .pulso-ecg {
      fill: none;
      stroke: url(#linha);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 260 1000;
      animation: varrer 3.2s linear infinite;
    }

    @keyframes subir {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flutuar {
      from { transform: translateY(0); }
      to   { transform: translateY(-18px); }
    }
    @keyframes varrer {
      from { stroke-dashoffset: 260; }
      to   { stroke-dashoffset: -1000; }
    }

    @media (prefers-reduced-motion: reduce) {
      .entrada, .bolha, .pulso-ecg { animation: none; }
      .pulso-ecg { stroke-dasharray: none; }
    }
  </style>

  <g clip-path="url(#recorte)">
    <rect width="1200" height="320" fill="url(#fundo)" />

    <circle class="bolha" cx="110" cy="70" r="46" opacity="0.10" />
    <circle class="bolha bolha-2" cx="1090" cy="250" r="64" opacity="0.08" />
    <circle class="bolha bolha-3" cx="980" cy="60" r="26" opacity="0.14" />
    <circle class="bolha bolha-4" cx="230" cy="215" r="20" opacity="0.12" />

    <text x="600" y="130" text-anchor="middle" class="titulo entrada">
      <tspan fill="#F5F5F2">Fisio</tspan><tspan fill="#43B77A">Quest</tspan>
    </text>
    <text x="600" y="178" text-anchor="middle" class="subtitulo entrada atraso-1" fill="#8FDBAF">
      Quiz interativo de Fisioterapia
    </text>

    <path class="base-ecg" d="M40 268 H200 Q215 246 230 268 H250 L262 280 L290 212 L318 298 L334 268 H360 Q385 238 410 268 H640 Q655 246 670 268 H690 L702 280 L730 212 L758 298 L774 268 H800 Q825 238 850 268 H1160" />
    <path class="pulso-ecg" pathLength="1000" filter="url(#brilho)" d="M40 268 H200 Q215 246 230 268 H250 L262 280 L290 212 L318 298 L334 268 H360 Q385 238 410 268 H640 Q655 246 670 268 H690 L702 280 L730 212 L758 298 L774 268 H800 Q825 238 850 268 H1160" />
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#245239" stroke-width="2" />
</svg>